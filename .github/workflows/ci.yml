name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build (cgo-free)
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: Test
        run: go test ./...

  web:
    name: Web lint + type-check + static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Type-check
        working-directory: web
        run: npx tsc --noEmit
      - name: Build static export
        working-directory: web
        run: npm run build

  e2e:
    name: Playwright e2e (real binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      # webServer in playwright.config.ts runs `make build` (npm + go) then launches
      # the cgo-free binary against a temp DB with a seeded admin. CI disables
      # reuseExistingServer, so every run builds and boots the real binary.
      - name: Run e2e
        working-directory: web
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  go-postgres:
    name: Go test (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: phumpanya
          POSTGRES_USER: phumpanya
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phumpanya"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test against Postgres
        env:
          APP_DATABASE_URL: postgres://phumpanya:ci@localhost:5432/phumpanya?sslmode=disable
        run: go test ./internal/db/ -run TestOpenWithPostgres -v

  stack-validate:
    name: Validate compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        env:
          APP_DOMAIN: example.org
          APP_ADMIN_PASSWORD: ci
          POSTGRES_PASSWORD: ci
        run: docker compose config >/dev/null
      - name: caddy validate
        run: |
          docker run --rm -e APP_DOMAIN=example.org \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
