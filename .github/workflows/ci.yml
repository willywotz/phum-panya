name: ci

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build (cgo-free)
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: Test
        run: go test ./...

  web:
    name: Web type-check + static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Type-check
        working-directory: web
        run: npx tsc --noEmit
      - name: Build static export
        working-directory: web
        run: npm run build

  e2e:
    name: Playwright e2e (real binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      # webServer in playwright.config.ts runs `make build` (npm + go) then launches
      # the cgo-free binary against a temp DB with a seeded admin. CI disables
      # reuseExistingServer, so every run builds and boots the real binary.
      - name: Run e2e
        working-directory: web
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  release:
    name: Release binary
    # Tag pushes only; gated on all three CI jobs passing.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go, web, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build single cgo-free binary (embeds UI)
        run: make build
      - name: Name the artifact
        run: mv server "server-${GITHUB_REF_NAME}-linux-amd64"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "server-${GITHUB_REF_NAME}-linux-amd64" --generate-notes --title "${GITHUB_REF_NAME}"
