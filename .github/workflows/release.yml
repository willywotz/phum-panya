name: release

# Cut a release by pushing a v* tag on a commit that already passed `ci`.
# Builds the linux binary, the Windows exe, and the MSI, smoke-tests the MSI's
# install/register/uninstall flow, then publishes a GitHub Release.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows exe + MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web + embed
        shell: bash
        run: |
          (cd web && npm ci && npm run build)
          find internal/webui/dist -mindepth 1 ! -name index.html -delete
          cp -r web/out/. internal/webui/dist/
      - name: Build server.exe
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -o bin/server.exe ./cmd/server
      - name: Compute MSI version
        id: ver
        shell: bash
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build MSI (WiX v5)
        shell: bash
        run: |
          dotnet build deploy/windows/phum-panya.wixproj -c Release \
            -p:ProductVersion=${{ steps.ver.outputs.v }} \
            -p:ServerExeSource="$PWD/bin/server.exe"
      - name: Locate MSI
        id: msi
        shell: bash
        run: echo "path=$(find . -name 'phum-panya*.msi' | head -1)" >> "$GITHUB_OUTPUT"
      - name: Smoke test install / query / uninstall
        shell: pwsh
        run: |
          # find returned a ./forward/slash path; msiexec needs a full Windows path.
          $msi = (Resolve-Path "${{ steps.msi.outputs.path }}").Path
          Write-Host "Installing $msi"
          $i = Start-Process msiexec -Wait -PassThru -ArgumentList `
            "/i","`"$msi`"","/quiet","/l*v","install.log", `
            "ADMINEMAIL=admin@test","ADMINPASSWORD=pw123456","APPDOMAIN="
          Write-Host "install exit code: $($i.ExitCode)"
          Write-Host "===== install.log (service custom actions) ====="
          if (Test-Path install.log) {
            Select-String -Path install.log -Pattern 'InstallSvc|StartSvc|CAQuietExec|WixQuietExec|Doing action|Action ended|service install|service start|phum-panya|CustomAction' |
              Select-Object -Last 80 | ForEach-Object { $_.Line }
          }
          if ($i.ExitCode -ne 0) { throw "install failed ($($i.ExitCode))" }
          Write-Host "===== sc query / qc ====="
          sc.exe query phum-panya
          $svc = $LASTEXITCODE
          sc.exe qc phum-panya
          if ($svc -ne 0) { throw "service phum-panya was not registered (sc=$svc)" }
          $u = Start-Process msiexec -Wait -PassThru -ArgumentList `
            "/x","`"$msi`"","/quiet","/l*v","uninstall.log"
          if ($u.ExitCode -ne 0) { Get-Content uninstall.log -Tail 200; throw "uninstall failed ($($u.ExitCode))" }
          sc.exe query phum-panya
          if ($LASTEXITCODE -eq 0) { throw "service still present after uninstall" }
          Write-Host "MSI install / query / uninstall smoke test passed"
          # The expected 1060 from the last sc query would otherwise be the step exit code.
          exit 0
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: |
            bin/server.exe
            ${{ steps.msi.outputs.path }}
          retention-days: 7

  images:
    name: Publish images to ghcr.io
    uses: ./.github/workflows/build-images.yml
    with:
      push: true
    permissions:
      contents: read
      packages: write

  release:
    name: Publish release
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build linux binary (embeds UI)
        run: make build
      - name: Name linux binary
        run: mv server "server-${GITHUB_REF_NAME}-linux-amd64"
      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-artifacts
          path: win
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe="$(find win -name 'server.exe' | head -1)"
          msi="$(find win -name 'phum-panya*.msi' | head -1)"
          cp "$exe" "server-${GITHUB_REF_NAME}-windows-amd64.exe"
          cp "$msi" "phum-panya-${GITHUB_REF_NAME}-windows-amd64.msi"
          gh release create "${GITHUB_REF_NAME}" \
            "server-${GITHUB_REF_NAME}-linux-amd64" \
            "server-${GITHUB_REF_NAME}-windows-amd64.exe" \
            "phum-panya-${GITHUB_REF_NAME}-windows-amd64.msi" \
            --generate-notes --title "${GITHUB_REF_NAME}"
