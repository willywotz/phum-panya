# Dev reverse proxy: one origin in front of the Go API and the Next.js dev
# server. /api and /media -> Go (api:8080); everything else -> Next.js dev
# (web:3000), including the hot-module-reload websocket.
#
# Same-origin by design: the frontend's relative fetch('/api/...') calls, the
# session cookie, and the Origin/CSRF behavior all match production.

# Map the Upgrade header so websocket connections (Next.js HMR) tunnel through.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api { server api:8080; }
upstream web { server web:3000; }

server {
    listen 80;
    server_name _;

    # Uploads + JSON API -> Go. The full request URI is preserved.
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pages, /_next assets, and the HMR websocket -> Next.js dev server.
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
