# phum-panya — DEVELOPMENT stack: Next.js (web) + Go API (api) split behind an
# nginx reverse proxy on a single origin, with hot reload on both sides.
#
# Uses `docker compose watch` (not bind mounts): each service is built from a
# small dev image with source + deps baked in, and watch syncs later changes.
#
# Quick start:
#   APP_ADMIN_PASSWORD=change-me docker compose -f docker-compose.dev.yaml up --watch
# then browse http://localhost:${APP_HOST_PORT:-8080}
# (override APP_HOST_PORT if 8080 is taken — common on Windows/WSL2, e.g. 18080).
#
# Production is unchanged: use docker-compose.yaml (one embedded binary).

services:
  # Single public entry point. Routes /api and /media to the Go service and
  # everything else (pages, /_next, HMR websocket) to the Next.js dev server.
  nginx:
    build:
      context: .
      dockerfile: deploy/dev/nginx.Dockerfile
    image: phum-panya-dev-nginx
    container_name: phum-panya-dev-nginx
    depends_on:
      web:
        condition: service_started
        restart: true
      api:
        condition: service_started
        restart: true
    ports:
      - "${APP_HOST_PORT:-8080}:80"
    restart: unless-stopped
    develop:
      watch:
        # Reload the proxy when its config changes.
        - action: sync+restart
          path: ./deploy/nginx/dev.conf
          target: /etc/nginx/conf.d/default.conf

  # Next.js dev server with hot-module-reload. Not published; reached via nginx.
  web:
    build:
      context: .
      dockerfile: deploy/dev/web.Dockerfile
    image: phum-panya-dev-web
    container_name: phum-panya-dev-web
    environment:
      # Poll the synced filesystem so HMR fires reliably on WSL2/Docker.
      WATCHPACK_POLLING: "true"
    expose:
      - "3000"
    restart: unless-stopped
    develop:
      watch:
        # Sync frontend source into the container for HMR.
        - action: sync
          path: ./web
          target: /app/web
          ignore:
            - node_modules/
            - .next/
        # A dependency change needs a fresh npm ci -> rebuild the image.
        - action: rebuild
          path: ./web/package-lock.json

  # Go API with air live-reload. Not published; reached via nginx.
  api:
    build:
      context: .
      dockerfile: deploy/dev/api.Dockerfile
    image: phum-panya-dev-api
    container_name: phum-panya-dev-api
    environment:
      APP_DEV: "1"
      APP_HTTP_ADDR: ":8080"
      # First-admin bootstrap (seeded once, on first run).
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.com}
      # Required — compose refuses to start if unset (no default password).
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?set APP_ADMIN_PASSWORD in your env or .env file}
      # Mutable state lives in the dev-data volume.
      APP_DB_PATH: /data/app.db
      APP_MEDIA_DIR: /data/media
      APP_BACKUP_DIR: /data/backup
    volumes:
      # Persist the Go build cache and app data across restarts (state, not source).
      - dev-go-cache:/root/.cache/go-build
      - dev-data:/data
    expose:
      - "8080"
    restart: unless-stopped
    develop:
      watch:
        # Sync Go source; air (inside the container) rebuilds on change.
        - action: sync
          path: .
          target: /app
          ignore:
            - web/
            - .git/
            - .superpowers/
            - .claude/
            - docs/
            - data/
            - tmp/
            - "*.db"
        # A module change needs a fresh go mod download -> rebuild the image.
        - action: rebuild
          path: ./go.mod

volumes:
  dev-go-cache:
  dev-data:
