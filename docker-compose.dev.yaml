# phum-panya — DEVELOPMENT stack, kept at parity with production
# (docker-compose.yaml): the SAME Caddy reverse proxy + the SAME Postgres, with
# the api in the SAME behind-proxy mode. The only difference from prod is that
# web + api run in hot-reload mode (`next dev` / `air`) instead of compiled
# builds — so what you develop against matches what ships.
#
# Caddy reuses the prod Caddyfile verbatim: pointing APP_DOMAIN at an http://
# localhost address makes Caddy serve plain HTTP (no ACME/TLS) on that port.
#
# Uses `docker compose watch`: each app service builds from a small dev image
# (source + deps baked in) and watch syncs later changes.
#
# Quick start:
#   APP_ADMIN_PASSWORD=change-me docker compose -f docker-compose.dev.yaml up --watch
# then browse http://localhost:${APP_HOST_PORT:-8080}
# (override APP_HOST_PORT if 8080 is taken — common on Windows/WSL2, e.g. 18080).
#
# Production: use docker-compose.yaml (same topology, TLS + compiled builds).

services:
  # Same Postgres image and role as prod.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phumpanya}
      POSTGRES_USER: ${POSTGRES_USER:-phumpanya}
      # Defaulted for frictionless local dev; set it in .env to match prod.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - dev-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phumpanya}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Same public entry point as prod: Caddy on one origin, reusing deploy/caddy/
  # Caddyfile. Routes /api/* -> api, /media/* -> file_server (shared volume),
  # everything else -> web. Caddy proxies the Next.js HMR websocket natively.
  caddy:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_started
        restart: true
      web:
        condition: service_started
        restart: true
    environment:
      # http:// -> Caddy serves plain HTTP on this port, no TLS/ACME in dev.
      APP_DOMAIN: http://localhost:${APP_HOST_PORT:-8080}
    ports:
      - "${APP_HOST_PORT:-8080}:${APP_HOST_PORT:-8080}"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./deploy/caddy/Caddyfile
          target: /etc/caddy/Caddyfile

  # Next.js dev server with hot-module-reload. Not published; reached via caddy.
  web:
    build:
      context: .
      dockerfile: deploy/dev/web.Dockerfile
    environment:
      # Poll the synced filesystem so HMR fires reliably on WSL2/Docker.
      WATCHPACK_POLLING: "true"
    expose:
      - "3000"
    volumes:
      # Keep the Turbopack/Next compile cache across `--force-recreate` restarts
      # so `make dev` does not recompile cold every time.
      - dev-next-cache:/app/web/.next
    restart: unless-stopped
    develop:
      watch:
        # Sync frontend source into the container for HMR.
        - action: sync
          path: ./web
          target: /app/web
          ignore:
            - node_modules/
            - .next/
        # A dependency change needs a fresh npm ci -> rebuild the image.
        - action: rebuild
          path: ./web/package-lock.json

  # Go API with air live-reload, in the SAME behind-proxy + Postgres mode as
  # prod. Not published; reached via caddy.
  api:
    build:
      context: .
      dockerfile: deploy/dev/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    environment:
      APP_DB_DRIVER: postgres
      APP_DATABASE_URL: postgres://${POSTGRES_USER:-phumpanya}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-phumpanya}?sslmode=disable
      APP_BEHIND_PROXY: "1"
      APP_PUBLIC_ORIGIN: http://localhost:${APP_HOST_PORT:-8080}
      APP_HTTP_ADDR: ":8080"
      APP_MEDIA_DRIVER: s3
      APP_S3_ENDPOINT: http://garage:3900
      APP_S3_REGION: garage
      APP_S3_BUCKET: ${APP_S3_BUCKET:-media}
      APP_S3_ACCESS_KEY: ${APP_S3_ACCESS_KEY:?set APP_S3_ACCESS_KEY}
      APP_S3_SECRET_KEY: ${APP_S3_SECRET_KEY:?set APP_S3_SECRET_KEY}
      # First-admin bootstrap (seeded once, on first run).
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.com}
      # Required — compose refuses to start if unset (no default password).
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?set APP_ADMIN_PASSWORD in your env or .env file}
      APP_THROTTLE_STORE: db
    volumes:
      # Persist the Go build cache.
      - dev-go-cache:/root/.cache/go-build
    expose:
      - "8080"
    restart: unless-stopped
    develop:
      watch:
        # Sync Go source; air (inside the container) rebuilds on change.
        - action: sync
          path: .
          target: /app
          ignore:
            - web/
            - .git/
            - .superpowers/
            - .claude/
            - docs/
            - data/
            - tmp/
            - "*.db"
        # A module change needs a fresh go mod download -> rebuild the image.
        - action: rebuild
          path: ./go.mod

  # Same internal Garage node + one-shot init as prod: the api stores
  # uploads here over the S3 API (no shared media volume, no public port).
  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET}
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage-init:
    build:
      context: .
      dockerfile: deploy/garage/Dockerfile.init
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET}
      APP_S3_BUCKET: ${APP_S3_BUCKET:-media}
      APP_S3_ACCESS_KEY: ${APP_S3_ACCESS_KEY:?set APP_S3_ACCESS_KEY}
      APP_S3_SECRET_KEY: ${APP_S3_SECRET_KEY:?set APP_S3_SECRET_KEY}
    network_mode: "service:garage"
    volumes:
      - garage-meta:/var/lib/garage/meta:ro
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
    restart: on-failure

volumes:
  dev-go-cache:
  dev-next-cache:
  dev-pg-data:
  caddy-data:
  caddy-config:
  garage-meta:
  garage-data:
