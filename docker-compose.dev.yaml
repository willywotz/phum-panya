# phum-panya — DEVELOPMENT stack: Next.js (web) + Go API (api) split behind an
# nginx reverse proxy on a single origin, with hot reload on both sides.
#
# Quick start:
#   APP_ADMIN_PASSWORD=change-me docker compose -f docker-compose.dev.yaml up
# then browse http://localhost:${APP_HOST_PORT:-8080}
# (override APP_HOST_PORT if 8080 is taken — common on Windows/WSL2, e.g. 18080).
#
# Production is unchanged: use docker-compose.yaml (one embedded binary).

services:
  # Single public entry point. Routes /api and /media to the Go service and
  # everything else (pages, /_next, HMR websocket) to the Next.js dev server.
  nginx:
    image: nginx:1.27-alpine
    container_name: phum-panya-dev-nginx
    depends_on: [web, api]
    ports:
      - "${APP_HOST_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Next.js dev server with hot-module-reload. Not published; reached via nginx.
  web:
    image: node:24-alpine
    container_name: phum-panya-dev-web
    working_dir: /app/web
    # Install deps once (into the named volume), then run the dev server.
    command: sh -c "[ -x node_modules/.bin/next ] || npm ci; exec npm run dev -- -H 0.0.0.0 -p 3000"
    environment:
      # Poll the bind-mounted filesystem so HMR fires reliably on WSL2/Docker.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./web:/app/web
      # Named volumes so the host does not clobber the container install.
      - dev-web-node-modules:/app/web/node_modules
      - dev-web-next:/app/web/.next
    expose:
      - "3000"
    restart: unless-stopped

  # Go API with air live-reload. Not published; reached via nginx.
  api:
    image: golang:1.25-alpine
    container_name: phum-panya-dev-api
    working_dir: /app
    # Install a pinned air into the cached GOPATH volume (once), then live-reload.
    # air v1.67.0 is the newest release compatible with Go 1.25 (v1.67.4+ needs Go 1.26).
    command: sh -c "command -v air >/dev/null || go install github.com/air-verse/air@v1.67.0; exec air -c .air.toml"
    environment:
      APP_DEV: "1"
      APP_HTTP_ADDR: ":8080"
      # First-admin bootstrap (seeded once, on first run).
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.com}
      # Required — compose refuses to start if unset (no default password).
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?set APP_ADMIN_PASSWORD in your env or .env file}
      # Mutable state lives in the dev-data volume.
      APP_DB_PATH: /data/app.db
      APP_MEDIA_DIR: /data/media
      APP_BACKUP_DIR: /data/backup
      # Keep the Go build cache in the persisted /go volume for fast rebuilds.
      GOCACHE: /go/.cache
    volumes:
      - ./:/app
      - dev-go-cache:/go
      - dev-data:/data
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  dev-web-node-modules:
  dev-web-next:
  dev-go-cache:
  dev-data:
