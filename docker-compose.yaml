# docker-compose.yaml — container stack: Caddy + Next.js web + Go api +
# Postgres + a pg_dump backup sidecar (ADR-0003).
# Usage: set APP_DOMAIN + secrets in .env, then:
#   docker compose up -d --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phumpanya}
      POSTGRES_USER: ${POSTGRES_USER:-phumpanya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phumpanya}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DB_DRIVER: postgres
      APP_DATABASE_URL: postgres://${POSTGRES_USER:-phumpanya}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-phumpanya}?sslmode=disable
      APP_BEHIND_PROXY: "1"
      APP_PUBLIC_ORIGIN: https://${APP_DOMAIN:?set APP_DOMAIN}
      APP_HTTP_ADDR: ":8080"
      APP_MEDIA_DIR: /data/media
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.com}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?set APP_ADMIN_PASSWORD}
    volumes:
      - media:/data/media

  web:
    build:
      context: web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-phumpanya}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-phumpanya}
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - pg-backups:/backups

  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET}
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage-init:
    build:
      context: .
      dockerfile: deploy/garage/Dockerfile.init
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET}
      APP_S3_BUCKET: ${APP_S3_BUCKET:-media}
      APP_S3_ACCESS_KEY: ${APP_S3_ACCESS_KEY:?set APP_S3_ACCESS_KEY}
      APP_S3_SECRET_KEY: ${APP_S3_SECRET_KEY:?set APP_S3_SECRET_KEY}
    network_mode: "service:garage"
    volumes:
      - garage-meta:/var/lib/garage/meta:ro
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
    restart: on-failure

volumes:
  pg-data:
  pg-backups:
  media:
  caddy-data:
  caddy-config:
  garage-meta:
  garage-data:
