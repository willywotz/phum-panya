# docker-compose.yaml — container stack: Caddy + Next.js web + Go api +
# Postgres + a pg_dump backup sidecar (ADR-0003).
# Usage: set APP_DOMAIN + secrets in .env, then:
#   docker compose up -d --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phumpanya}
      POSTGRES_USER: ${POSTGRES_USER:-phumpanya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phumpanya}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      APP_DB_DRIVER: postgres
      APP_DATABASE_URL: postgres://${POSTGRES_USER:-phumpanya}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-phumpanya}?sslmode=disable
      APP_AUTO_MIGRATE: "false"
      APP_BEHIND_PROXY: "1"
      APP_PUBLIC_ORIGIN: https://${APP_DOMAIN:?set APP_DOMAIN}
      APP_HTTP_ADDR: ":8080"
      APP_MEDIA_DRIVER: s3
      APP_S3_ENDPOINT: http://garage:3900
      APP_S3_REGION: garage
      APP_S3_BUCKET: ${APP_S3_BUCKET:-media}
      APP_S3_ACCESS_KEY: ${APP_S3_ACCESS_KEY:?set APP_S3_ACCESS_KEY}
      APP_S3_SECRET_KEY: ${APP_S3_SECRET_KEY:?set APP_S3_SECRET_KEY}
      APP_THROTTLE_STORE: db
      APP_OTLP_ENDPOINT: jaeger:4317
      APP_LOG_LEVEL: info
      APP_LOG_FORMAT: json
      APP_SERVICE_NAME: phum-panya-api

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    command: ["migrate"]
    healthcheck:
      disable: true
    environment:
      APP_DB_DRIVER: postgres
      APP_DATABASE_URL: postgres://${POSTGRES_USER:-phumpanya}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-phumpanya}?sslmode=disable
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.com}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?set APP_ADMIN_PASSWORD}

  web:
    build:
      context: web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
      - jaeger
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-phumpanya}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-phumpanya}
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - pg-backups:/backups

  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET}
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage-init:
    build:
      context: .
      dockerfile: deploy/garage/Dockerfile.init
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET}
      APP_S3_BUCKET: ${APP_S3_BUCKET:-media}
      APP_S3_ACCESS_KEY: ${APP_S3_ACCESS_KEY:?set APP_S3_ACCESS_KEY}
      APP_S3_SECRET_KEY: ${APP_S3_SECRET_KEY:?set APP_S3_SECRET_KEY}
    network_mode: "service:garage"
    volumes:
      - garage-meta:/var/lib/garage/meta:ro
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
    restart: on-failure

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      QUERY_BASE_PATH: /traces

  media-backup:
    image: rclone/rclone:latest
    restart: unless-stopped
    depends_on:
      garage:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    environment:
      APP_S3_ENDPOINT: http://garage:3900
      APP_S3_BUCKET: ${APP_S3_BUCKET:-media}
      APP_S3_ACCESS_KEY: ${APP_S3_ACCESS_KEY:?set APP_S3_ACCESS_KEY}
      APP_S3_SECRET_KEY: ${APP_S3_SECRET_KEY:?set APP_S3_SECRET_KEY}
      MEDIA_BACKUP_PATH: ${MEDIA_BACKUP_PATH:-media-backup}
      MEDIA_BACKUP_KEEP_DAYS: ${MEDIA_BACKUP_KEEP_DAYS:-30}
      MEDIA_BACKUP_INTERVAL: ${MEDIA_BACKUP_INTERVAL:-86400}
      RCLONE_CONFIG_DEST_TYPE: ${RCLONE_CONFIG_DEST_TYPE:-}
      RCLONE_CONFIG_DEST_PROVIDER: ${RCLONE_CONFIG_DEST_PROVIDER:-}
      RCLONE_CONFIG_DEST_ENDPOINT: ${RCLONE_CONFIG_DEST_ENDPOINT:-}
      RCLONE_CONFIG_DEST_ACCESS_KEY_ID: ${RCLONE_CONFIG_DEST_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_DEST_HOST: ${RCLONE_CONFIG_DEST_HOST:-}
      RCLONE_CONFIG_DEST_USER: ${RCLONE_CONFIG_DEST_USER:-}
      RCLONE_CONFIG_DEST_KEY_FILE: ${RCLONE_CONFIG_DEST_KEY_FILE:-}
    entrypoint: ["/bin/sh", "/media-backup.sh"]
    volumes:
      - ./deploy/backup/media-backup.sh:/media-backup.sh:ro
      - ./deploy/backup/media-backup-lib.sh:/media-backup-lib.sh:ro

volumes:
  pg-data:
  pg-backups:
  caddy-data:
  caddy-config:
  garage-meta:
  garage-data:
